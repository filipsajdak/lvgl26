name: docs

# A pull request that only changes the documentation does not start ci.yml.
# This run checks it: the snippets against their files, then the rendered site.
on:
  pull_request:
    paths: ['docs/**', 'site/**', 'examples/quick_start/**', 'tools/docs.py', 'tools/docs_page.html',
            'tools/rules.py', 'tools/check_includes.py', 'tools/test_docs.py', 'tools/test_rules.py',
            'tools/check_site.py', 'tools/cost_page.py', 'tools/cost_history.py', 'tools/metrics/probes.json',
            '.github/workflows/docs.yml']

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the snippets, the links, the code for C names, the messages and the outline
        run: python3 tools/docs.py check
      - name: Check the rules and their page
        run: python3 tools/rules.py --check-page docs/rules.md
      - name: Test the tools that check the pages
        run: |
          python3 tools/test_docs.py
          python3 tools/test_rules.py
      - name: Render the documentation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc
          python3 tools/docs.py build
      - name: Write the compile-cost page, empty here (pages.yml fills it from the history)
        run: python3 tools/cost_page.py /dev/null site/metrics.html
      - name: Check the site
        run: python3 tools/check_site.py
