name: ci

# The quick checks: every pull request and every push to main. The long ones run every
# night: see nightly.yml.
on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '**.md']
  pull_request:
    paths-ignore: ['site/**', '**.md']

# A new push to a pull request replaces the run of the push before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The container the jobs below run in. It is built only when its Dockerfile changed.
  image:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write

  # Each preset builds with warnings as errors and runs the whole test suite.
  host:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The sanitizers need ptrace and an unrestricted address space layout.
      options: --cap-add SYS_PTRACE --security-opt seccomp=unconfined
    strategy:
      fail-fast: false
      matrix:
        preset:
          - host-v96
          - host-v10
          - host-v96-asan      # AddressSanitizer + UndefinedBehaviorSanitizer
          - host-v96-analyze   # GCC static analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ matrix.preset }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --preset ${{ matrix.preset }} -j "$(nproc)"

  # ThreadSanitizer on the tests that use more than one thread. The whole suite runs
  # under it every night.
  tsan-threads:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --cap-add SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: host-v96-tsan
      - name: Build the threaded tests
        run: |
          cmake --preset host-v96-tsan
          cmake --build --preset host-v96-tsan --target ui_scheduler task
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --preset host-v96-tsan -R '^(ui_scheduler|task)$' -j "$(nproc)"

  # Complexity and CRAP: every function at complexity 8 or less, and every function
  # that runs at run time at CRAP 8 or less. See tools/crap.py.
  crap:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: host-v96-coverage
      - name: Build and test with coverage
        run: |
          cmake --preset host-v96-coverage
          cmake --build --preset host-v96-coverage
          ctest --preset host-v96-coverage -j "$(nproc)"
      - name: CRAP report
        run: python3 tools/crap.py build/host-v96-coverage

  # The JSON reader is plain C++, so Clang's libFuzzer can fuzz it with coverage
  # feedback. One minute here, half an hour every night; ctest replays the corpus above.
  fuzz-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the fuzz target
        run: |
          clang++ -std=c++23 -g -O1 -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all \
            -Iinclude fuzz/json_reader.cpp -o json_reader
      - name: Fuzz for one minute
        run: |
          mkdir -p new_corpus
          ./json_reader new_corpus fuzz/corpus/json -max_total_time=60 -max_len=4096
