name: ci

# The quick checks: every pull request and every push to main. The long ones run every
# night: see nightly.yml.
on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '**.md']
  pull_request:
    paths-ignore: ['site/**', '**.md']

# A new push to a pull request replaces the run of the push before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write

  # Throwaway: which shape of code makes GCC's analyzer report a null `this` (shown.cpp:52 on #183).
  repro:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-key: host-v96-analyze
      - name: Configure
        run: cmake --preset host-v96-analyze
      - name: Each reproducer and the test, under the analyzer
        shell: bash
        run: |
          run_all() {
            for t in repro_held_stored repro_held_like_test shown; do
              echo "=== $1 $t"
              cmake --build --preset host-v96-analyze --target $t 2>&1 | grep -E "error|note: argument" | head -6 || true
            done
          }
          run_all before
          python3 tests/analyzer_repro/patch_held.py
          run_all after
