name: ci

# The quick checks: every pull request and every push to main. The long ones run every
# night: see nightly.yml.
on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '**.md']
  pull_request:
    paths-ignore: ['site/**', '**.md']

# A new push to a pull request replaces the run of the push before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The container the jobs below run in. It is built only when its Dockerfile changed.
  image:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write

  # Each preset builds with warnings as errors and runs the tests that run a program.
  # The compile-fail tests are the next job: they need no build.
  host:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The sanitizers need ptrace and an unrestricted address space layout.
      options: --cap-add SYS_PTRACE --security-opt seccomp=unconfined
    strategy:
      fail-fast: false
      matrix:
        preset:
          - host-v96
          - host-v10
          - host-v96-asan      # AddressSanitizer + UndefinedBehaviorSanitizer
          - host-v96-analyze   # GCC static analyzer: what it reports is a build error
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ matrix.preset }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Compiler cache statistics
        run: ccache --show-stats --verbose
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --preset ${{ matrix.preset }} -LE compile-fail -j "$(nproc)"

  # The compile-fail tests: each compiles one file that must be refused, and checks the
  # message. They are most of the suite and each is a whole compile, so they are spread
  # over three runners for each LVGL version. They only need the project configured.
  compile-errors:
    needs: image
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        preset: [host-v96, host-v10]
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} -L compile-fail -I ${{ matrix.part }},,3 -j "$(nproc)"

  # ThreadSanitizer on the tests that use more than one thread. The whole suite runs
  # under it every night.
  tsan-threads:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --cap-add SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: host-v96-tsan
      - name: Build the threaded tests
        run: |
          cmake --preset host-v96-tsan
          cmake --build --preset host-v96-tsan --target ui_scheduler task
      - name: Compiler cache statistics
        run: ccache --show-stats --verbose
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --preset host-v96-tsan -R '^(ui_scheduler|task)$' -j "$(nproc)"

  # The image with Clang, for the job below.
  image-editor:
    uses: ./.github/workflows/image.yml
    with:
      name: ci-editor
    permissions:
      contents: read
      packages: write

  # The editor stubs (tools/editor): Clang reads the examples and the mistakes an editor
  # must mark, and clangd reads a project that turns editor support on. Only lv_names is
  # built, which lists the public names; the other tests need the project configured.
  # A failed test prints what Clang reported.
  editor:
    runs-on: ubuntu-latest
    needs: image-editor
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image-editor.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: host-v96-editor
      - name: Versions
        run: |
          g++-16 --version | head -n 1
          clang++ --version
          clangd --version
          # Where Clang finds its standard library: the stubs are read with it.
          clang++ -v -x c++ -fsyntax-only /dev/null 2>&1 | grep -E 'Selected GCC|Target|^ /'
      - name: Configure
        run: |
          cmake --preset host-v96
          grep -E 'LVGL26_CLANG(XX|D):' build/host-v96/CMakeCache.txt
      - name: Build the list of public names
        run: cmake --build --preset host-v96 --target lv_names
      - name: Test
        run: ctest --preset host-v96 -R '^editor_' -j "$(nproc)" --output-on-failure
      - name: The stubs, if a test failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-stubs
          path: |
            build/host-v96/tests/editor/stubs
            build/host-v96/tests/editor/consumer/project/.clangd
            build/host-v96/Testing/Temporary/LastTest.log
          include-hidden-files: true

  # Complexity and CRAP: every function at complexity 8 or less, and every function
  # that runs at run time at CRAP 8 or less. See tools/crap.py.
  crap:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          cache-key: host-v96-coverage
      - name: Build and test with coverage
        run: |
          cmake --preset host-v96-coverage
          cmake --build --preset host-v96-coverage
          ctest --preset host-v96-coverage -LE compile-fail -j "$(nproc)"
      - name: Compiler cache statistics
        run: ccache --show-stats --verbose
      - name: CRAP report
        run: python3 tools/crap.py build/host-v96-coverage

  # The JSON reader is plain C++, so Clang's libFuzzer can fuzz it with coverage
  # feedback. One minute here, half an hour every night; ctest replays the corpus above.
  fuzz-json:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the fuzz target
        run: |
          clang++ -std=c++23 -g -O1 -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all \
            -Iinclude fuzz/json_reader.cpp -o json_reader
      - name: Fuzz for one minute
        run: |
          mkdir -p new_corpus
          ./json_reader new_corpus fuzz/corpus/json -max_total_time=60 -max_len=4096
