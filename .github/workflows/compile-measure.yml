name: compile-measure

# Throwaway, on a branch that is deleted afterwards: which measures of compile cost work on a
# GitHub-hosted runner.
on:
  push:
    branches: [tmp/compile-measure]

jobs:
  image:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write

  container:
    runs-on: ubuntu-latest
    needs: image
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --cap-add SYS_ADMIN --cap-add PERFMON --cap-add SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: |
          cat /proc/sys/kernel/perf_event_paranoid
          apt-get update -qq && apt-get install -y linux-perf valgrind qemu-user curl 2>&1 | tail -4; valgrind --version
          which perf valgrind qemu-x86_64 || true
          find / -name 'libinsn*' 2>/dev/null | head -3 || true
          perf stat -e instructions:u -x, -- true 2>&1 | tail -3 || true
      - name: DynamoRIO
        continue-on-error: true
        run: |
          url=$(curl -s https://api.github.com/repos/DynamoRIO/dynamorio/releases/latest | grep browser_download_url | grep -E '/DynamoRIO-Linux-[0-9.]+\.tar\.gz' | head -1 | cut -d'"' -f4)
          echo "$url"; curl -fsSL "$url" | tar -xz -C /opt; ls /opt | head
          echo "DRRUN=$(ls -d /opt/DynamoRIO-*/bin64/drrun | head -1)" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset host-v96 > /dev/null && ls build/host-v96/compile_commands.json
      - name: The text of -fmem-report and -fstats
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "tools"); sys.path.insert(0, "tmp-measure")
          import measure as m
          mode, cmd, cwd = m.cc1_for("build/host-v96", "tests/smoke.cpp", ".")
          for i in (1, 2):
              r = m.sh(cmd + ["-fmem-report"], cwd=cwd)
              open(f"/tmp/mem{i}.txt", "w").write(r.stderr)
          r = m.sh(cmd + ["-fstats"], cwd=cwd); open("/tmp/stats.txt", "w").write(r.stderr)
          PY
          echo '### mem-report, run 1' >> "$GITHUB_STEP_SUMMARY"; grep -n -i -E "total|allocated|still" /tmp/mem1.txt | head -40 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '### equal between runs?' >> "$GITHUB_STEP_SUMMARY"; (diff -q /tmp/mem1.txt /tmp/mem2.txt && echo identical) | tee -a "$GITHUB_STEP_SUMMARY"; diff /tmp/mem1.txt /tmp/mem2.txt | head -10 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '### stats' >> "$GITHUB_STEP_SUMMARY"; head -60 /tmp/stats.txt | tee -a "$GITHUB_STEP_SUMMARY"
