name: compile-measure

# Throwaway, on a branch that is deleted afterwards: which measures of compile cost work on a
# GitHub-hosted runner.
on:
  push:
    branches: [tmp/compile-measure]

jobs:
  image:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write

  container:
    runs-on: ubuntu-latest
    needs: image
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --cap-add SYS_ADMIN --cap-add PERFMON --cap-add SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: |
          cat /proc/sys/kernel/perf_event_paranoid
          apt-get update -qq && apt-get install -y linux-perf valgrind qemu-user curl 2>&1 | tail -4; valgrind --version
          which perf valgrind qemu-x86_64 || true
          find / -name 'libinsn*' 2>/dev/null | head -3 || true
          perf stat -e instructions:u -x, -- true 2>&1 | tail -3 || true
      - name: DynamoRIO
        continue-on-error: true
        run: |
          url=$(curl -s https://api.github.com/repos/DynamoRIO/dynamorio/releases/latest | grep browser_download_url | grep -E '/DynamoRIO-Linux-[0-9.]+\.tar\.gz' | head -1 | cut -d'"' -f4)
          echo "$url"; curl -fsSL "$url" | tar -xz -C /opt; ls /opt | head
          echo "DRRUN=$(ls -d /opt/DynamoRIO-*/bin64/drrun | head -1)" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset host-v96 > /dev/null && ls build/host-v96/compile_commands.json
      - name: DynamoRIO inscount on smoke.cpp
        continue-on-error: true
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, os, subprocess, sys, time
          sys.path.insert(0, "tools"); sys.path.insert(0, "tmp-measure")
          import measure as m
          mode, cmd, cwd = m.cc1_for("build/host-v96", "tests/smoke.cpp", ".")
          dr = os.environ["DRRUN"]; root = os.path.dirname(os.path.dirname(dr))
          print("clients:", glob.glob(root + "/**/libinscount*", recursive=True)[:3])
          client = (glob.glob(root + "/**/libinscount.so", recursive=True) or [None])[0]
          t = time.perf_counter()
          r = m.sh([dr, "-c", client, "--"] + cmd, cwd=cwd)
          print("DynamoRIO inscount smoke:", (r.stderr + r.stdout).strip()[-300:], f"{time.perf_counter() - t:.0f} s")
          PY
      - name: Pairs of commits, to see what each counter would have caught
        continue-on-error: true
        timeout-minutes: 90
        run: |
          git config --global --add safe.directory "$PWD"
          git fetch -q --unshallow || true
          printf '#include <lv/lv.hpp>\nint main() {}\n' > /tmp/inc.cpp
          pair() {  # name, commit, file to compile (tests/ probe name is smoke)
            echo "### $1 ($2)" | tee -a "$GITHUB_STEP_SUMMARY"
            rm -rf /tmp/b /tmp/a; git worktree add -q --detach /tmp/b "$2^"; git worktree add -q --detach /tmp/a "$2"
            python3 tmp-measure/pair.py "$PWD" build/host-v96 smoke.cpp "$3" /tmp/b /tmp/a 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            git worktree remove --force /tmp/b; git worktree remove --force /tmp/a
          }
          pair "include-only: no props struct" 794b6ca /tmp/inc.cpp
          pair "smoke: option lists off the path" 9299d42 "$PWD/tests/smoke.cpp"
          pair "include-only: one_of out of lv.hpp" 15101c0 /tmp/inc.cpp
          pair "include-only: theme feature" ce5557e /tmp/inc.cpp
