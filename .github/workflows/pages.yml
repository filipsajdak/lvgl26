name: pages

# Publishes site/ to GitHub Pages. The pages in site/docs are rendered from docs/ first
# (tools/docs.py, with pandoc); the rest of the site is plain files.
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', 'examples/quick_start/**', 'tools/check_site.py', 'tools/docs.py',
            'tools/docs_page.html', '.github/workflows/pages.yml']
  workflow_dispatch:

# One deployment at a time. A newer one waits for the one that is running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Checks the site and stores it as the artifact that the next job publishes.
  # Two jobs, as GitHub documents it: an artifact is only reliably there for a later
  # job. With the upload and the deployment in one job, the deployment sometimes
  # found no artifact.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Render the documentation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc
          python3 tools/docs.py check
          python3 tools/docs.py build
      - name: Check links and assets
        run: python3 tools/check_site.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
