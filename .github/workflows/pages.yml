name: pages

# Publishes site/ to GitHub Pages. The pages in site/docs are rendered from docs/ first
# (tools/docs.py, with pandoc); the rest of the site is plain files.
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', 'examples/quick_start/**', 'tools/check_site.py', 'tools/docs.py',
            'tools/rules.py', 'tools/docs_page.html', 'tools/cost_page.py', 'tools/cost_history.py', 'tools/metrics/probes.json',
            '.github/workflows/pages.yml']
  # The trend of the compile cost is written from the branch `metrics`, which the nightly run adds to.
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:

# One deployment at a time. A newer one waits for the one that is running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Checks the site and stores it as the artifact that the next job publishes.
  # Two jobs, as GitHub documents it: an artifact is only reliably there for a later
  # job. With the upload and the deployment in one job, the deployment sometimes
  # found no artifact.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render the documentation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc
          python3 tools/docs.py check
          python3 tools/docs.py build
      - name: Write the compile-cost page from the history
        run: |
          git fetch --depth 1 origin metrics:refs/remotes/origin/metrics || true
          git show origin/metrics:history.jsonl > /tmp/history.jsonl 2>/dev/null || : > /tmp/history.jsonl
          python3 tools/cost_page.py /tmp/history.jsonl site/metrics.html
      - name: Check links and assets
        run: python3 tools/check_site.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
