name: pages

# Publishes site/ to GitHub Pages. The site is plain files: there is no build step.
on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/check_site.py', '.github/workflows/pages.yml']
  workflow_dispatch:

# One deployment at a time. A newer one waits for the one that is running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Checks the site and stores it as the artifact that the next job publishes.
  # Two jobs, as GitHub documents it: an artifact is only reliably there for a later
  # job. With the upload and the deployment in one job, the deployment sometimes
  # found no artifact.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check links and assets
        run: python3 tools/check_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
