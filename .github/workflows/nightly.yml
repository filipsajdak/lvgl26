name: nightly

# The long checks, every night and on demand. A failure opens an issue.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: >-
          Mutate the lines of include/lv changed since this git ref, instead of since the last
          good nightly run. The base of the nightly run does not move.
        required: false
        type: string
      web_only:
        description: Run only the experimental WebAssembly jobs (web-host, web, web-browser). A manual run opens no issue.
        required: false
        type: boolean
        default: false
      arm_only:
        description: Run only the Arm Cortex-M4 jobs (image-arm, arm). A manual run opens no issue.
        required: false
        type: boolean
        default: false


jobs:
  # The container the jobs below run in. It is built only when its Dockerfile changed.
  image:
    if: ${{ !inputs.arm_only }}
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write

  # The presets that the quick checks leave out, with every test that runs a program.
  # (A compile-fail test only compiles, so a sanitizer has nothing to check in it.)
  host:
    if: ${{ !inputs.web_only && !inputs.arm_only }}
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --cap-add SYS_PTRACE --security-opt seccomp=unconfined
    strategy:
      fail-fast: false
      matrix:
        preset:
          - host-v10-asan      # AddressSanitizer + UndefinedBehaviorSanitizer on the v10 pin
          - host-v96-tsan      # ThreadSanitizer, every test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ matrix.preset }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Compiler cache statistics
        run: ccache --show-stats --verbose
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --preset ${{ matrix.preset }} -LE compile-fail -j "$(nproc)"

  # Half an hour of libFuzzer on the JSON reader. An input that crashes it is kept as
  # an artifact, to be added to fuzz/corpus/json with the fix.
  fuzz-json:
    if: ${{ !inputs.web_only && !inputs.arm_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the fuzz target
        run: |
          clang++ -std=c++23 -g -O1 -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all \
            -Iinclude fuzz/json_reader.cpp -o json_reader
      - name: Fuzz for half an hour
        run: |
          mkdir -p new_corpus
          ./json_reader new_corpus fuzz/corpus/json -max_total_time=1800 -max_len=4096
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-json-crash
          path: |
            crash-*
            leak-*
            timeout-*
            oom-*

  # The microcontroller check: the slice built for an Arm Cortex-M4 without exceptions
  # and run in QEMU. Its sizes go to the run's summary.
  image-arm:
    if: ${{ !inputs.web_only }}
    uses: ./.github/workflows/image.yml
    with:
      name: ci-arm
    permissions:
      contents: read
      packages: write

  arm:
    runs-on: ubuntu-latest
    needs: image-arm
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image-arm.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the slice for Cortex-M4 and run it in QEMU
        shell: bash
        run: |
          set -o pipefail
          tools/arm-run.sh 2>&1 | tee arm-run.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stack-report
          path: build/arm-m4/examples/mcu/CMakeFiles/set_stack_probe.dir/set_probe.cpp.su
      - name: Report what it printed and its sizes
        if: always()
        run: |
          {
            echo '### The slice on Cortex-M4 (QEMU mps2-an386)'
            echo '```'
            cat arm-run.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The experimental browser target: the two applications of examples/wasm (a counter that takes
  # pointer input, and the bouncing ball, which is a test of coroutines) built for WebAssembly by
  # GCC trunk with a third-party back end, in the image of its own. The host build of the same files
  # gives the frames to match; a headless Chrome then runs the pages. Limits are in
  # docs/research/web-target.md. Failures open the issue of the night, like the rest.
  web-host:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      counter: ${{ steps.run.outputs.counter }}
      bounce: ${{ steps.run.outputs.bounce }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build both applications for the host and replay their scripts
        id: run
        shell: bash
        run: |
          tools/wasm/fetch-lvgl.sh /tmp/lvgl
          tools/wasm/host-demo.sh /tmp/lvgl/src /tmp/host-counter "$PWD" counter
          mkdir -p /tmp/host-bounce && ln -s /tmp/host-counter/obj /tmp/host-bounce/obj
          tools/wasm/host-rebuild.sh /tmp/lvgl/src /tmp/host-bounce "$PWD" bounce
          for app in counter bounce; do
            /tmp/host-$app/demo-host > /tmp/host-$app/frames.raw
            echo "$app=$(sha256sum /tmp/host-$app/frames.raw | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          done

  image-wasm:
    if: ${{ !inputs.arm_only }}
    uses: ./.github/workflows/image.yml
    with:
      name: ci-wasm
    permissions:
      contents: read
      packages: write

  web:
    runs-on: ubuntu-latest
    needs: [image-wasm, web-host]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image-wasm.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image still patches std::noop_coroutine (tools/wasm/fix-coroutine.sh). Undo it, so
      # that this job proves the tasks need no patched header.
      - name: Give libstdc++ its own coroutine header back
        shell: bash
        run: |
          header=/work/gw2/libstdcxx/install/include/c++/17.0.0/coroutine
          sed -i 's/__dummy_resume_destroy(void\*) { }/__dummy_resume_destroy() { }/; s/void (\*__r)(void\*) = /void (*__r)() = /; s/void (\*__d)(void\*) = /void (*__d)() = /' "$header"
          grep -q '__dummy_resume_destroy() { }' "$header"
          grep -q 'void (\*__r)() = ' "$header"
      - name: Build both applications for WebAssembly
        shell: bash
        run: |
          set -o pipefail
          tools/wasm/fetch-lvgl.sh /tmp/lvgl
          tools/wasm/build-lvgl.sh /tmp/lvgl/src /tmp/lvgl-wasm
          for app in counter bounce; do
            tools/wasm/link-demo.sh "$PWD" /tmp/lvgl/src /tmp/lvgl-wasm "$app.wasm" "$app" 2>&1 | tee "build-$app.txt"
          done
      - name: Replay the scripts and compare the frames with the host build
        shell: bash
        env:
          HOST_COUNTER: ${{ needs.web-host.outputs.counter }}
          HOST_BOUNCE: ${{ needs.web-host.outputs.bounce }}
        run: |
          echo '### The applications as WebAssembly' >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for app in counter bounce; do
            node tools/wasm/replay.mjs "$app.wasm" "examples/wasm/$app/script.json" > "$app.raw"
            wasm_frames="$(sha256sum "$app.raw" | cut -d' ' -f1)"
            host_var="HOST_${app^^}"; host_frames="${!host_var}"
            {
              echo "- ${app}: module $(wc -c < "$app.wasm") bytes, $(brotli -c -q 11 "$app.wasm" | wc -c) with Brotli"
              echo "  - frames, host (GCC 16):  \`${host_frames}\`"
              echo "  - frames, WebAssembly:    \`${wasm_frames}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            test "${wasm_frames}" = "${host_frames}" || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: web-modules
          path: |
            counter.wasm
            bounce.wasm
            build-*.txt

  # Chrome is on the runner, not in the image: the pages are checked in a browser.
  web-browser:
    runs-on: ubuntu-latest
    needs: [web, web-host]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: web-modules
      - name: Run the pages
        shell: bash
        env:
          HOST_COUNTER: ${{ needs.web-host.outputs.counter }}
          HOST_BOUNCE: ${{ needs.web-host.outputs.bounce }}
        run: |
          set -o pipefail
          chrome=/usr/bin/google-chrome
          python3 tools/wasm/make-page.py tools/wasm/page/index.html counter.wasm examples/wasm/counter/script.json "$HOST_COUNTER" > counter.html
          python3 tools/wasm/make-page.py tools/wasm/page/index.html bounce.wasm examples/wasm/bounce/script.json "$HOST_BOUNCE" "The bouncing ball" "The bouncing ball of the motion demo." > bounce.html
          # The script of each application, run inside Chrome, must give the host's frames.
          node tools/wasm/drive-chrome.mjs "file://$PWD/counter.html#selftest" counter-self "$chrome" --expect-title ok
          node tools/wasm/drive-chrome.mjs "file://$PWD/bounce.html#selftest" bounce-self "$chrome" --expect-title ok
          # Real mouse events on the counter: three clicks, a drag, a click.
          node tools/wasm/drive-chrome.mjs "file://$PWD/counter.html" counter-click "$chrome" 2>&1 | tee counter-click.txt
          # The ball runs for a minute, and a trap in a coroutine shows in the title.
          node tools/wasm/drive-chrome.mjs "file://$PWD/bounce.html" bounce-run "$chrome" --run 60 2>&1 | tee bounce-run.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: web-screenshots
          path: |
            *.png
            counter-click.txt
            bounce-run.txt

  # What a file costs the compiler, measured as Valgrind's instruction count of one cc1plus
  # (tools/compile_cost.py, probes in tools/metrics/probes.json). One job for each probe, in
  # parallel. The collecting job compares the night with the baseline, appends it to the history
  # on the branch `metrics` (only on main), and fails when a probe got dearer beyond its
  # threshold, which the report job turns into the issue of the night. docs/research/compile-time.md, "The nightly measure".
  cost-plan:
    if: ${{ !inputs.web_only && !inputs.arm_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The compile probes
        id: plan
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          probes = json.load(open("tools/metrics/probes.json"))["probes"]
          print("matrix=" + json.dumps({"include": [{"probe": p["id"], "kind": p["kind"]} for p in probes if p["kind"] != "stack"]}))
          PY

  cost:
    needs: [image, cost-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cost-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure, to fetch LVGL and write the compile database
        run: cmake --preset host-v96 > /dev/null
      - name: Build the run-time probe
        if: ${{ matrix.kind == 'run' }}
        run: cmake --build --preset host-v96 --target visibility_probe
      - name: Measure the probe
        env:
          PROBE: ${{ matrix.probe }}
          KIND: ${{ matrix.kind }}
        run: |
          python3 tools/compile_cost.py "$KIND" build/host-v96 "$PROBE" > "row-$PROBE.json"
          cat "row-$PROBE.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cost-${{ matrix.probe }}
          path: row-${{ matrix.probe }}.json

  cost-collect:
    needs: [cost-plan, cost, arm]
    if: ${{ always() && needs.cost-plan.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: metrics
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: cost-*
          path: rows
          merge-multiple: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          name: stack-report
          path: stack
      - name: The branch of the history
        run: |
          git fetch origin metrics:metrics || true
          if git rev-parse --verify -q metrics > /dev/null; then
            git worktree add metrics metrics
          else
            git worktree add --orphan -b metrics metrics
          fi
      - name: Judge the night
        id: judge
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import glob, json, pathlib, sys
          sys.path.insert(0, "tools")
          import compile_cost
          rows = [json.load(open(f)) for f in sorted(glob.glob("rows/row-*.json"))]
          report = glob.glob("stack/*.su")
          if report:
              probe = [p for p in compile_cost.load_probes().values() if p["kind"] == "stack"][0]
              rows.append(compile_cost.stack_row(pathlib.Path(report[0]).read_text(), probe))
          json.dump(rows, open("rows.json", "w"))
          print(len(rows), "rows")
          PY
          status=0
          python3 tools/cost_history.py judge --rows rows.json --history metrics/history.jsonl \
            --baseline metrics/baseline.json --commit "$GITHUB_SHA" --date "$(date -u +%F)" \
            --run "$RUN_URL" > verdicts.json 2> summary.md || status=$?
          { echo '### Compile cost, Valgrind instruction count'; cat summary.md; } >> "$GITHUB_STEP_SUMMARY"
          echo "regression=$([ "$status" = 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Keep the history
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          cd metrics
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.jsonl baseline.json
          git commit -m "metrics: the night of $(date -u +%F) at ${GITHUB_SHA::7}"
          git push origin metrics
      - name: Fail on a regression, so that the report job opens the issue of the night
        if: ${{ steps.judge.outputs.regression == 'true' }}
        run: |
          echo "A probe got dearer beyond its threshold: see the summary of this job."
          exit 1

  # Mutation testing of the lines of include/lv that changed since the last good run: one
  # shard for each changed header (tools/mutation_plan.py; tools/mutation_tests.json says
  # which tests judge it). Locally a fixed-seed sample is enough for a quick look.
  mutation-plan:
    if: ${{ !inputs.web_only && !inputs.arm_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      any: ${{ steps.plan.outputs.any }}
      since: ${{ steps.plan.outputs.since }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the base commit and the tag are needed
      - name: Choose the headers
        id: plan
        env:
          SINCE_INPUT: ${{ inputs.since }}
        run: |
          since="${SINCE_INPUT}"
          if [ -z "$since" ] && git rev-parse -q --verify refs/tags/nightly-mutation-base > /dev/null; then
            since=nightly-mutation-base
          fi
          if [ -z "$since" ]; then
            echo "No base yet: nothing is mutated tonight, and the base is set to this commit."
            {
              echo "any=false"
              echo "since=${GITHUB_SHA}"
              echo 'matrix={"include":[]}'
            } >> "$GITHUB_OUTPUT"
          else
            python3 tools/mutation_plan.py --since "$since" --github-output "$GITHUB_OUTPUT"
          fi

  mutation:
    needs: [image, mutation-plan]
    if: needs.mutation-plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    # GitHub ends a job at six hours. The run stops judging mutants earlier, so that it
    # can say how far it got.
    timeout-minutes: 350
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutation-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-key: mutation-${{ matrix.name }}
      - name: Mutate the changed lines of ${{ matrix.header }}
        shell: bash
        env:
          HEADER: ${{ matrix.header }}
          TESTS: ${{ matrix.tests }}
          TARGETS: ${{ matrix.targets }}
          SINCE: ${{ needs.mutation-plan.outputs.since }}
          # Two jobs at a time: a mutant is built and tested one after the other.
          CMAKE_BUILD_PARALLEL_LEVEL: 2
          CTEST_PARALLEL_LEVEL: 2
        run: |
          set -o pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 tools/mutation.py "$HEADER" --tests "$TESTS" ${TARGETS:+--targets "$TARGETS"} \
            --since "$SINCE" --time-budget 17400 --accepted tools/mutation_accepted.json \
            --report mutation-report.json 2>&1 | tee mutation.log
      - name: Summary
        if: always()
        env:
          # A value of the matrix reaches the script as a variable, never as text of the script.
          HEADER: ${{ matrix.header }}
          FALLBACK: ${{ matrix.fallback && '--fallback' || '' }}
        run: |
          if [ -f mutation-report.json ]; then
            python3 tools/mutation_summary.py mutation-report.json ${FALLBACK:+"$FALLBACK"} >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Mutation: ${HEADER}: no report, see the log." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-${{ matrix.name }}
          path: |
            mutation-report.json
            mutation.log

  # The next night mutates what changed after this run. Only a run that judged every mutant
  # of every header, with no survivor left to triage, moves the base. A run with an explicit
  # `since` leaves it where it is.
  mutation-base:
    needs: [mutation-plan, mutation]
    if: >-
      ${{ always() && needs.mutation-plan.result == 'success'
      && (needs.mutation.result == 'success' || needs.mutation.result == 'skipped')
      && inputs.since == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Move the base to this commit
        run: |
          git tag -f nightly-mutation-base "${GITHUB_SHA}"
          git push --force origin refs/tags/nightly-mutation-base

  mutation-report:
    needs: [mutation]
    if: ${{ always() && needs.mutation.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Mutants survived the nightly run ($(date -u +%F))" \
            --body "Mutation testing of the changed lines of include/lv found mutants that the tests do not kill, or ran out of time before it judged them all. The run: ${RUN_URL}

          Each shard of the run has a summary with the survivors (file, line, the mutant) and an artifact, mutation-<header>, with mutation-report.json and the log.

          Triage every survivor: write a test that kills it, or add it to tools/mutation_accepted.json with the reason it is equivalent (the program means the same) or arid (nothing observable depends on it). A shard that ran out of time says \"N of M mutants were judged; the rest were not reached\" in its summary. To continue, run the workflow again by hand (workflow_dispatch) with since=nightly-mutation-base, or raise --time-budget in the mutation job (the job limit is 350 minutes). The base tag nightly-mutation-base does not move until a night is clean, so nothing it did not reach is lost."

  # One issue for a failed night, so that it is not only an email to whoever pushed last.
  report:
    needs: [host, fuzz-json, arm, web-host, web, web-browser, cost-plan, cost, cost-collect]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Nightly checks failed ($(date -u +%F))" \
            --body "The nightly run failed: ${RUN_URL}"
