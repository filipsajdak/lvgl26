name: Set up the build
description: Restores the compiler cache. The tools themselves are in the CI image.
inputs:
  cache-key:
    description: Names the compiler cache; one per preset.
    required: true
runs:
  using: composite
  steps:
    - name: Use the compiler cache
      shell: bash
      run: |
        # Most files do not change between two runs: ccache gives their objects back
        # from the cache. That holds for LVGL's C files and for our C++ files.
        echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
        echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
        echo "CCACHE_DIR=${GITHUB_WORKSPACE}/.ccache" >> "$GITHUB_ENV"
        echo "CCACHE_MAXSIZE=400M" >> "$GITHUB_ENV"
        # ccache before 4.14 does not see #embed in direct mode: after a change to an
        # embedded file it would give the old object back. Without direct mode it hashes
        # the preprocessed text, which holds the embedded bytes.
        ccache --version | head -n 1
        if ! printf '4.14\n%s\n' "$(ccache --version | sed -n '1s/.* //p')" | sort -V -C; then
          echo "CCACHE_NODIRECT=1" >> "$GITHUB_ENV"
          echo "Direct mode is off."
        fi
    - uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-${{ inputs.cache-key }}-${{ github.sha }}
        restore-keys: ccache-${{ inputs.cache-key }}-
