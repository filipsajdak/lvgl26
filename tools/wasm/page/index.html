<!doctype html>
<meta charset="utf-8">
<title>lvgl26 native WebAssembly</title>
<style>body{font:14px sans-serif;margin:16px}canvas{border:1px solid #888;image-rendering:pixelated}</style>
<h1>lvgl26 as native WebAssembly</h1>
<canvas id="screen" width="320" height="240"></canvas>
<p id="report">loading</p>
<script type="module">
// A minimal WASI Preview 1 host: the program writes its frame to standard output.
const W = 320, H = 240;
const out = [];
let memory;
const view = () => new DataView(memory.buffer);
const wasi = {
  fd_write(fd, iovs, count, written) {
    const dv = view(); let total = 0;
    for (let i = 0; i < count; i++) {
      const ptr = dv.getUint32(iovs + i * 8, true), len = dv.getUint32(iovs + i * 8 + 4, true);
      if (fd === 1) out.push(new Uint8Array(memory.buffer, ptr, len).slice());
      total += len;
    }
    dv.setUint32(written, total, true); return 0;
  },
  proc_exit(code) { throw new Error('exit ' + code); },
  args_sizes_get(argc, size) { const dv = view(); dv.setUint32(argc, 0, true); dv.setUint32(size, 0, true); return 0; },
  args_get() { return 0; },
  environ_sizes_get(count, size) { const dv = view(); dv.setUint32(count, 0, true); dv.setUint32(size, 0, true); return 0; },
  environ_get() { return 0; },
  clock_time_get(id, precision, time) { view().setBigUint64(time, BigInt(Math.round(performance.now() * 1e6)), true); return 0; },
  random_get(ptr, len) { crypto.getRandomValues(new Uint8Array(memory.buffer, ptr, len)); return 0; },
  fd_close() { return 0; }, fd_seek() { return 70; }, fd_fdstat_get() { return 8; },
  fd_prestat_get() { return 8; }, fd_prestat_dir_name() { return 8; },
};
const t0 = performance.now();
const { instance } = await WebAssembly.instantiateStreaming(fetch('frame.wasm'), { wasi_snapshot_preview1: wasi });
memory = instance.exports.memory;
try { instance.exports._start(); } catch (e) { if (!String(e).includes('exit 0')) throw e; }
const t1 = performance.now();
const bytes = new Uint8Array(out.reduce((n, c) => n + c.length, 0));
let at = 0; for (const c of out) { bytes.set(c, at); at += c.length; }
const image = new ImageData(W, H);
for (let i = 0; i < W * H; i++) {
  const v = bytes[i * 2] | (bytes[i * 2 + 1] << 8);   // RGB565, little endian
  image.data[i * 4] = ((v >> 11) & 31) * 255 / 31;
  image.data[i * 4 + 1] = ((v >> 5) & 63) * 255 / 63;
  image.data[i * 4 + 2] = (v & 31) * 255 / 31;
  image.data[i * 4 + 3] = 255;
}
document.getElementById('screen').getContext('2d').putImageData(image, 0, 0);
const digest = [...new Uint8Array(await crypto.subtle.digest('SHA-256', bytes))].map(b => b.toString(16).padStart(2, '0')).join('');
document.getElementById('report').textContent =
  `frame ${bytes.length} bytes, sha256 ${digest}, instantiate+run ${(t1 - t0).toFixed(1)} ms`;
document.title = 'done ' + digest;
</script>
